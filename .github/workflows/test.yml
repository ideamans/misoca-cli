name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt が必要なファイル: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # 埋め込みリファレンスは go:embed の都合でコミットしている。
      # ズレ防止はここで再生成して差分を検査すること。
      - name: 埋め込みLLMリファレンスの再生成
        run: go generate ./...

      - name: コミット済みリファレンスが古ければ失敗
        run: |
          if ! git diff --exit-code -- internal/llmdocs; then
            echo "::error::internal/llmdocs が古いです。'go generate ./...' を実行してコミットしてください。"
            exit 1
          fi

      - name: test
        run: go test -race ./...

      - name: llm サブコマンドの出力確認
        run: |
          go run ./cmd llm | head -5
          go run ./cmd llm --format json | head -5
